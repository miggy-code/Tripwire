name: Verify Tripwire
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: tripwire_test
          POSTGRES_USER: tripwire
          POSTGRES_PASSWORD: test-only-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U tripwire -d tripwire_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://tripwire:test-only-password@localhost:5432/tripwire_test
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
